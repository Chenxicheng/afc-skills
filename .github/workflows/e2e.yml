name: E2E

# Cloud CI may provision build dependencies online. The installed-package E2E
# suite itself uses offline installation and local fixtures, never live public
# skill services. Corporate GitHub live verification is a separate opt-in command.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Local .tgz path already available on the runner (optional); URLs/registry specs are rejected'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22.20.0'
          - os: ubuntu-latest
            node-version: '24'
          - os: macos-latest
            node-version: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e
        env:
          SKILLS_E2E_PACKAGE: ${{ inputs.package }}
