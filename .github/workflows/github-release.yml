name: GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afc-skills-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Chenxicheng/afc-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify release identity
        run: node -e "const p=require('./package.json'); if(p.name!=='afc-skills'||p.version!=='1.0.1') process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm format:check
      - name: Test all runtime contracts
        run: pnpm exec vitest run
      - name: Test installed package locally
        run: pnpm test:e2e
      - name: Package and smoke-test built npm tarball (no npm publishing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          npm pack --pack-destination release-assets
          git archive --format=zip --prefix=afc-skills/ -o release-assets/afc-skills-1.0.1-source.zip HEAD
          PACKAGE="$PWD/release-assets/afc-skills-1.0.1.tgz"
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$PACKAGE"
          test "$(npx --offline afc-skills --version)" = '1.0.1'
          NO_COLOR=1 npx --offline afc-skills --help | grep -F 'Usage: afc-skills'
          cd "$GITHUB_WORKSPACE/release-assets"
          sha256sum *.tgz *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: afc-skills-1.0.1
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afc-skills-1.0.1
          path: release-assets
      - name: Create GitHub Release only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite an existing release or tag. Re-runs stop safely.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq v1.0.1 existing-releases.txt; then
            echo 'Release v1.0.1 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' > existing-tags.txt
          if grep -Fxq v1.0.1 existing-tags.txt; then
            echo 'Tag v1.0.1 already exists; refusing to overwrite.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          afc-skills 1.0.1: enterprise intranet edition.

          - Default Git host: code.sdsdev.co.kr; explicit public sources are rejected.
          - Disable public search, telemetry, audit uploads, blob acceleration and Notion.
          - Block cross-host redirects, automatic submodules and network-share paths.
          - Preserve aipro and Claude Code ordering and installation directories.
          - Built, tested and packaged by GitHub Actions. Not published to npm.

          Global installation: `npm install -g /path/to/afc-skills-1.0.1.tgz`
          Then run `afc-skills --help`.
          Requires Node.js >=22.20.0. This tarball is NOT a standalone offline bundle:
          runtime dependencies require a prepared local cache or approved registry.

          Full unit and local installed-package tests run before release. Actual enterprise
          authentication, CA trust and repository access require separate intranet validation.
          Application-level host checks are not a replacement for network egress controls;
          Git/SSH/proxy configuration and filesystem mounts remain administrator-managed.
          NOTES
          gh release create v1.0.1 release-assets/* --target "$TARGET_SHA" --title 'afc-skills v1.0.1' --notes-file release-notes.md --latest
